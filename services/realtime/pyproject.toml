[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "q-agent-realtime"
version = "0.1.0"
description = "Local real-time meeting context and question pipeline for Q-Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pysilero-vad>=3.4,<4",
  "soundfile>=0.14,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.2,<2", "sounddevice>=0.5,<1"]

[project.scripts]
q-agent-realtime = "q_agent_realtime.__main__:main"
q-agent-realtime-server = "q_agent_realtime.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
q_agent_realtime = ["prompts/*.md"]

[tool.unittest]
start-directory = "tests"
