services:
  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    env_file:
      - ./services/realtime/.env
    environment:
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 8765
      REALTIME_DB_PATH: /app/data/q-agent.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REALTIME_API_KEY: ${REALTIME_API_KEY:-}
      MAX_AUDIO_SESSIONS: ${MAX_AUDIO_SESSIONS:-2}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-120}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_WS_URL: ${NEXT_PUBLIC_REALTIME_WS_URL:-ws://localhost:8765/v1/realtime}
    ports:
      - "3000:3000"
    environment:
      REALTIME_SERVICE_URL: http://realtime:8765
      REALTIME_API_KEY: ${REALTIME_API_KEY:-}
      NEXT_PUBLIC_REALTIME_WS_URL: ${NEXT_PUBLIC_REALTIME_WS_URL:-ws://localhost:8765/v1/realtime}
    depends_on:
      realtime:
        condition: service_healthy
